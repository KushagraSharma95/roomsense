name: docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t roomsense .
      - name: Run the simulated day in the container
        run: docker run --rm roomsense simulate --qrc-mock --no-plot
